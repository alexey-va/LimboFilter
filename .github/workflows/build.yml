name: Java CI with Gradle

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
      - 'src/test/e2e/**'
      - 'src/test/e2e-*/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
      - 'src/test/e2e/**'
      - 'src/test/e2e-*/**'
  workflow_dispatch:
    inputs:
      heavy_tests:
        description: Run expensive integration and Paper tests
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build LimboFilter
        run: ./gradlew --build-cache build
      - name: Upload LimboFilter
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LimboFilter
          path: "build/libs/limbofilter*.jar"
      - uses: dev-drprasad/delete-tag-and-release@v0.2.1
        if: ${{ github.event_name == 'push' }}
        with:
          delete_release: true
          tag_name: dev-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find git version
        id: git-version
        run: echo "id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Find correct JAR
        if: ${{ github.event_name == 'push' }}
        id: find-jar
        run: |
          output="$(find build/libs/ ! -name "*-javadoc.jar" ! -name "*-sources.jar" -type f -printf "%f\n")"
          echo "jarname=$output" >> "$GITHUB_OUTPUT"
      - name: Release the build
        if: ${{ github.event_name == 'push' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/libs/${{ steps.find-jar.outputs.jarname }}
          body: ${{ join(github.event.commits.*.message, '\n') }}
          prerelease: true
          name: Dev-build ${{ steps.git-version.outputs.id }}
          tag: dev-build
      - name: Upload to Modrinth
        if: ${{ github.event_name == 'push' }}
        uses: RubixDev/modrinth-upload@v1.0.0
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          file_path: build/libs/${{ steps.find-jar.outputs.jarname }}
          name: Dev-build ${{ steps.git-version.outputs.id }}
          version: ${{ steps.git-version.outputs.id }}
          changelog: ${{ join(github.event.commits.*.message, '\n') }}
          relations: TZOteSf2:required
          game_versions: 1.7.2
          release_type: beta
          loaders: velocity
          featured: false
          project_id: 6zIy0zBK
